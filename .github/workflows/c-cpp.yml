name: C/C++ CI

on:
  push:
    tags: [ "*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Ubuntu_22_04
            arch: x64
          - os: ubuntu-22.04-arm
            platform: Ubuntu_22_04
            arch: arm64
          - os: ubuntu-24.04
            platform: Ubuntu_24_04
            arch: x64
          - os: ubuntu-24.04-arm
            platform: Ubuntu_24_04
            arch: arm64
          - os: ubuntu-26.04
            platform: Ubuntu_26_04
            arch: x64
          - os: ubuntu-26.04-arm
            platform: Ubuntu_26_04
            arch: arm64
          - os: macos-26
            platform: MacOS_26
            arch: arm64

    steps:
    - uses: actions/checkout@v4
    - name: derive version
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
    - name: stamp version
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        perl -pi -e 's/"0\.0\.0"/"$ENV{VERSION}"/' src/api/version.h
        grep 'sw_version' src/api/version.h
    - name: make
      run: make
    - name: package binaries
      run: |
        mkdir -p dist
        cd bin
        zip "../dist/EpsilonDB_${PLATFORM}_${ARCH}_${VERSION}.zip" epsilond epsilonctl epsilonbkup epsilonbench
      env:
        PLATFORM: ${{ matrix.platform }}
        ARCH: ${{ matrix.arch }}
        VERSION: ${{ steps.version.outputs.version }}
    - name: upload to release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/EpsilonDB_*.zip
